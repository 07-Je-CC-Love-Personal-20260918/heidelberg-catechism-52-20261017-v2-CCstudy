name: build & publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE: heidelberg-catechism-52-20261017-v2-ccstudy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild index.html from src/
        run: cd src && python3 build.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "chore: rebuild index.html [skip ci]"
            git push
          fi
      - name: Stage site
        run: mkdir -p _site && cp index.html _site/ && echo "${SITE}.surge.sh" > _site/CNAME_SURGE
      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        if: env.SURGE_TOKEN != ''
        run: npx --yes surge ./_site "${SITE}.surge.sh" --token "$SURGE_TOKEN"
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_20260918 }}
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: |
          npm i -g netlify-cli@17 >/dev/null 2>&1
          netlify sites:create --name "$SITE" --disable-linking || true
          netlify deploy --prod --dir=_site --site "$SITE"
