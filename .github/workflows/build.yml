name: build & publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild index.html from src/
        run: cd src && python3 build.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html texts.html; then
            git add index.html texts.html
            git commit -m "chore: rebuild index.html [skip ci]"
            git push
          fi
      - name: Version → domain
        run: echo "SITE=heidelberg-catechism-52-$(tr -d '[:space:]' < VERSION)-ccser" >> "$GITHUB_ENV"
      - name: Stage site
        run: mkdir -p _site && cp index.html texts.html _site/ && echo "${SITE}.surge.sh" > _site/CNAME_SURGE
      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
        if: env.SURGE_TOKEN != ''
        run: |
          npm i -g surge >/dev/null 2>&1
          for i in 1 2 3; do surge ./_site "${SITE}.surge.sh" && break; echo "retry $i"; sleep 10; done
          curl -fsS "https://${SITE}.surge.sh/texts.html" -o /dev/null && echo "surge OK"
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_20260918 }}
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: |
          npm i -g netlify-cli@17 >/dev/null 2>&1
          ID=$(netlify api listSites --data "{\"name\":\"$SITE\",\"filter\":\"all\"}" | python3 -c "import json,sys,os;print(next((x['id'] for x in json.load(sys.stdin) if x['name']==os.environ['SITE']),''))")
          if [ -z "$ID" ]; then
            ID=$(netlify api createSite --data "{\"body\":{\"name\":\"$SITE\"}}" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          fi
          netlify deploy --prod --dir=_site --site "$ID"
